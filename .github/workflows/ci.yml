name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    env:
      # Tests that need a second Unix user (e.g. the admin socket refusing a
      # non-owner) skip locally without sudo. In CI a skip is a failure.
      HEEL_REQUIRE_PRIVILEGED_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:invariants
      - name: Drizzle migrations match the schema
        run: pnpm db:drift
      - name: Rules JSON Schema matches the Zod schema
        run: pnpm schema:drift

  oci-image:
    # D14: the image builds, starts with the example config, and answers on
    # both planes. Only the docker CLI on the runner; no extra actions.
    name: OCI image starts with the example config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t heel:ci .
      - name: Start with the example config
        run: |
          docker run -d --name heel -p 7300:7300 -p 7301:7301 \
            -e HEEL_MASTER_KEY="$(head -c 32 /dev/urandom | base64)" heel:ci
      - name: Both planes answer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7300/mcp || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          test "$code" = "401" || { echo "agent plane answered $code"; exit 1; }
          curl -sf http://localhost:7301/sign-in > /dev/null
      - name: Admin commands run inside the container
        run: docker exec heel heel agent add ci-smoke | grep -q 'Added agent "ci-smoke"'
      - name: Logs
        if: always()
        run: docker logs heel

  npm-package:
    # The npm package: built, packed, installed with npm into an empty
    # project (dependencies hoisted, as npm does), started, and answering.
    # The release workflow runs the same check before it publishes.
    name: npm package installs and serves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:smoke

  docs-site:
    # useheel.dev (docs/site/): built from README.md and docs/, so a change to
    # either can't break the site unnoticed.
    name: docs site builds
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build

  looks-like:
    # The looks_like release gate (spec D10 row): recall >= 0.99 per category
    # and <= 5% false positives on held-out ordinary mail. The ~440 MB Enron
    # archive is never committed. Its URL and SHA-256 are read from the
    # committed manifest, it is cached by that hash, and the eval script
    # verifies the hash again before reading it.
    name: looks_like evaluation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the pinned Enron archive from the manifest
        id: pin
        run: |
          node -e '
            const a = require("./corpus/looks-like/manifest.json").ordinary.archive;
            console.log(`url=${a.url}`);
            console.log(`sha256=${a.sha256}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Restore the Enron archive
        id: enron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/looks-like/enron_mail_20150507.tar.gz
          key: enron-${{ steps.pin.outputs.sha256 }}
      - name: Download the Enron archive
        if: steps.enron.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.pin.outputs.url }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          mkdir -p .cache/looks-like
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            --output .cache/looks-like/enron_mail_20150507.tar.gz "$URL"
          echo "$SHA256  .cache/looks-like/enron_mail_20150507.tar.gz" | sha256sum --check
      - name: Held-out recall and false-positive gate
        run: pnpm eval:looks-like

  mcp-conformance:
    # D5: the MCP conformance suite against heel's /mcp/<account> endpoint.
    # Scenarios for features heel doesn't proxy by design are listed in
    # scripts/mcp-conformance-baseline.yml; any other failure fails the job,
    # and so does a listed scenario that starts passing.
    name: MCP conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server scenarios
        run: pnpm mcp:conformance

  approval-page-browser:
    # D4: the approval page's passkey ceremonies in real Chromium with a
    # virtual WebAuthn authenticator. Screenshots of each step and a WebM are kept.
    name: approval page in a browser
    runs-on: ubuntu-24.04
    # Chromium and its system libraries come with Microsoft's Playwright image,
    # so nothing is downloaded or apt-installed per run (that step took 15 s to
    # 6+ min). The tag must match @playwright/test in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The image's Playwright matches the lockfile's
        run: |
          want="$(pnpm exec playwright --version | awk '{print $2}')"
          image="1.65.0"
          [ "$want" = "$image" ] || {
            echo "::error::@playwright/test is $want but the job's image is v$image: update the container tag"
            exit 1
          }
      - name: Approve, deny, pause and resume with a passkey
        run: pnpm test:browser
        env:
          HEEL_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/heel-e2e
      - name: Keep the screenshots and recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approval-page-screens
          path: ${{ runner.temp }}/heel-e2e
          if-no-files-found: ignore

  linux-sandbox:
    # Code mode (D6) and the CLI runner (D8) run under bubblewrap, which needs
    # unprivileged user namespaces. Ubuntu 24.04 restricts them through
    # AppArmor by default, so this job lifts that and runs the e2e suites
    # against the real sandbox.
    name: bubblewrap and user namespaces
    runs-on: ubuntu-24.04
    env:
      # A sandbox the probe can't start, or a skipped run-as-another-user test, fails the job.
      HEEL_REQUIRE_SANDBOX: "1"
      HEEL_REQUIRE_PRIVILEGED_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke-test an isolated bubblewrap sandbox
        run: |
          bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp \
            /usr/bin/true
      - name: Sandbox e2e (real bubblewrap)
        run: bwrap --version && pnpm test:e2e

  code-mode-other-os:
    # Code mode runs on every OS: without bubblewrap, on the locked-down
    # WebAssembly helper. This runs its tests and the escape corpus on the
    # hosts that use that path, so "runs on Windows and macOS" is checked,
    # not claimed.
    name: code mode on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/codemode
      - run: pnpm exec vitest run --config vitest.e2e.config.ts e2e/codemode
