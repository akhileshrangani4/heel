name: docs

# Deploys useheel.dev to production, from one commit. The release workflow
# calls this after each release with the released commit, so the site always
# documents a version people can install. Run it by hand to redeploy: it
# defaults to the latest release tag, or give it a ref (e.g. main) to ship a
# fix to the site itself early.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy (default the latest release tag)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy useheel.dev
    runs-on: ubuntu-24.04
    env:
      # The Vercel project (Root Directory: docs/site) is identified by these;
      # the token is a team-scoped Vercel token.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out what to deploy
        run: |
          if [ -z "$REF" ]; then
            REF=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | head -1)
            [ -n "$REF" ] || { echo "no release tag yet"; exit 1; }
          fi
          git checkout --detach "$REF"
          echo "Deploying $REF ($(git rev-parse --short HEAD))"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Deploy to production
        run: |
          # The project skips production builds without this mark, so a push
          # to main (Vercel's GitHub app) can't publish the site; previews still build.
          url=$(npx --yes vercel@62.2.0 deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env HEEL_RELEASE_DEPLOY=1)
          echo "Deployed $url"
          # Point the domain at it through the API: the CLI's `alias` looks up a
          # user first, and a team-scoped token has none.
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          id=$(api "https://api.vercel.com/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          api -X POST -H 'content-type: application/json' -d '{"alias":"useheel.dev"}' \
            "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" | jq -r '"useheel.dev -> " + .alias'
